[install]
# Only install packages published at least 7 days ago.
minimumReleaseAge = 604800

# Bun 1.4 defaults workspaces to the isolated linker, which nests each package under
# node_modules/.bun/<name>@<version>/node_modules/<name>. simple-git-hooks' postinstall
# resolves its own package.json one directory too high in that layout and crashes the
# install, so keep the hoisted layout Hunk has always installed with.
linker = "hoisted"
