[package]
name = "hunk-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: native hot paths (terminal width, intraline word diff) for hunk's review core."

[lib]
name = "hunk_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
imara-diff = "0.2"
unicode-general-category = "1.1.0"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
