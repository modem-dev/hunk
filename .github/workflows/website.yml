name: Website

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

on:
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - "bun.lock"
      - "scripts/generate-docs.ts"
      - "scripts/generate-docs.test.ts"
      - "scripts/check-website-links.ts"
      - "scripts/check-website-links.test.ts"
      - "src/core/cli.ts"
      - "src/core/config.ts"
      - "src/core/customThemes.ts"
      - "src/core/legacySyntaxScopes.ts"
      - "src/core/tabWidth.ts"
      - "src/hunk-session/agentSurface.ts"
      - "src/hunk-session/agentErrors.ts"
      - "src/hunk-review/skillDocument.ts"
      - "src/session-broker/brokerConfig.ts"
      - "src/ui/lib/shikiThemes.ts"
      - ".github/workflows/website.yml"
  push:
    branches:
      - main
      - docs/starlight-website
    paths:
      - "website/**"
      - "package.json"
      - "bun.lock"
      - "scripts/generate-docs.ts"
      - "scripts/generate-docs.test.ts"
      - "scripts/check-website-links.ts"
      - "scripts/check-website-links.test.ts"
      - "src/core/cli.ts"
      - "src/core/config.ts"
      - "src/core/customThemes.ts"
      - "src/core/legacySyntaxScopes.ts"
      - "src/core/tabWidth.ts"
      - "src/hunk-session/agentSurface.ts"
      - "src/hunk-session/agentErrors.ts"
      - "src/hunk-review/skillDocument.ts"
      - "src/session-broker/brokerConfig.ts"
      - "src/ui/lib/shikiThemes.ts"
      - ".github/workflows/website.yml"

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        run: bun install --cwd website --frozen-lockfile

      - name: Test website tooling
        run: bun test scripts/generate-docs.test.ts scripts/check-website-links.test.ts

      - name: Check generated reference docs
        run: bun run check:docs

      - name: Check website
        run: bun run website:check

      - name: Build website
        run: bun run website:build

      - name: Check static links and metadata
        run: bun run website:links

      - name: Install Chromium
        run: cd website && bunx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: bun run website:test:browser
